---
# defaults file for ansible-lustre
type: client
## Lustre MGS(관리 서버) 주소. 이 주소로 실제 라우팅되는 인터페이스를
## LNet 네트워크로 사용하므로 반드시 지정해야 합니다. 예) "192.168.1.10"
lustre_mgs_address: ""
## lustre_vendor: "cray" | "ddn" | "whamcloud"
lustre_vendor: "cray"
## true면 커널 버전 종속 kmod 패키지 대신 client_packages_dkms에 정의된
## DKMS 패키지를 설치합니다(대상 os_*.yml에 client_packages_dkms가 있어야 함).
lustre_dkms: false
## true면 lnet 설정(인터페이스 탐지 + /etc/modprobe.d/lustre.conf 작성)을
## 건너뜁니다. 실제 Lustre MGS가 없는 환경(예: role 자체를 검증만 하는
## CI VM)에서만 true로 설정하고, 그 외에는 항상 기본값 false를 유지하세요.
lustre_skip_lnet_config: false
