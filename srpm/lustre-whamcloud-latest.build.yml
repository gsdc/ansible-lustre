source:
  # "latest" is resolved at build time to the highest vX_Y_Z tag on
  # github.com/lustre/lustre-release (currently v2_17_56 == 2.17.56), so this
  # guide automatically tracks new Whamcloud releases without editing it.
  github_ref: "latest"

targets:
  - distribution: AlmaLinux
    version: "9.8"
    vendor: whamcloud

rpmbuild_options: "--without servers --without zfs --with ldiskfs --without gss-keyring --without mpi --without o2ib"
