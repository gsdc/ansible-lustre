---
# tasks file for ansible-lustre
- name: Enable powertools repo for EL8 variation.
  command: dnf config-manager --set-enabled powertools
  when:
    - ansible_distribution_major_version == "8"
    - (ansible_distribution == "AlmaLinux") or (ansible_distribution == "Rocky")
- name: Enable CRB repo for RHEL9 variation.
  command: dnf config-manager --set-enabled crb
  when:
    - ansible_distribution_major_version == "9"
    - (ansible_distribution == "AlmaLinux") or (ansible_distribution == "Rocky")
# rpmrebuild, dkms는 AppStream/CRB가 아니라 EPEL에서 제공된다.
- name: Enable EPEL repo
  dnf:
    name: epel-release
    state: present
  when:
    - (ansible_distribution_major_version == "8") or (ansible_distribution_major_version == "9")
    - (ansible_distribution == "AlmaLinux") or (ansible_distribution == "Rocky")
- name: Install python3-netaddr
  dnf:
    name: python3-netaddr
    state: installed
  when:
      - (ansible_distribution_major_version == "8") or (ansible_distribution_major_version == "9")
- name: OS/vendor 조합별 변수 불러오기
  include_vars:
    file: "os_{{ ansible_facts['distribution'] }}{{ ansible_facts['distribution_version'] }}_{{ lustre_vendor }}.yml"
- name: lustre_dkms일 때 client_packages_dkms 사용, 아니면 client_packages 사용
  set_fact:
    _client_packages: "{{ client_packages_dkms if (lustre_dkms | bool) else client_packages }}"
- name: Install Development Packages to compile lustre module
  package: 
    name: 
      - '@Development Tools' 
      - kernel-devel
      - openssl-devel
      - libmount-devel
      - libnl3-devel
      - libselinux-devel 
      - libselinux-static
      - zlib-devel
      - libyaml-devel
      - libtool
      - rpmrebuild
      - dkms
    state: present
- name: Lustre를 패키지 설치
  block:
    # TODO(임시 우회, 제거 대상): CVE-2026-34180 OpenSSL ASN.1 하드닝 이후
    # 파이썬 ssl 모듈이 새 에러 코드(ASN1_R_NOT_ENOUGH_DATA)를 인식하지
    # 못해 인증서 로드가 "[ASN1: NOT_ENOUGH_DATA]"로 실패하는 상위 버그
    # (python/cpython#151504, ansible/ansible#87251,
    # rpm-software-management/librepo#380) 때문에, openssl이 패치된
    # 버전으로 올라간 머신에서 get_url이 실패한다. 다운로드 대상이 이
    # 저장소 자신의 GitHub Release이므로 임시로 인증서 검증을 건너뛴다.
    # 파이썬/OpenSSL/ansible 쪽 수정이 배포되면 validate_certs를 제거할 것.
    - name: Lustre 패키지를 GitHub Release에서 다운로드
      get_url:
        url: "https://github.com/gsdc/ansible-lustre/releases/download/{{ lustre_release_tag }}/{{ item }}"
        dest: "/root/{{ item }}"
        mode: "0644"
        validate_certs: false
      with_items: "{{ _client_packages }}"
      when: lustre_release_tag is defined
      register: lustre_release_download
      until: lustre_release_download is succeeded
      retries: 3
      delay: 5

    - name: Lustre 패키지를 머신으로 복사
      copy:
        src: "files/{{ ansible_distribution }}{{ ansible_distribution_version }}_{{ lustre_vendor }}/{{ item }}"
        dest: "/root/{{ item }}"
        mode: "0644"
      with_items: "{{ _client_packages }}"
      when: lustre_release_tag is not defined

    - name: Install Lustre module
      yum:
        name: "/root/{{ item }}"
        state: present
        disable_gpg_check: yes
      with_items: "{{ _client_packages }}"

# lustre_mgs_address로 실제 라우팅되는 인터페이스를 찾아 lnet 설정을 만든다.
# 실제 Lustre MGS가 없는 환경(예: GitHub Actions VM에서의 role 테스트)에서는
# lustre_skip_lnet_config: true로 이 블록 전체를 건너뛸 수 있다. 기본값은
# false로, 별도 설정이 없으면 항상 lnet 설정을 만든다.
- name: lnet 설정
  when: not (lustre_skip_lnet_config | bool)
  block:
    # 예전 lustre_network(서브넷 CIDR) 변수를 그대로 쓰는 클러스터와의 호환성:
    # lustre_mgs_address가 지정되지 않았는데 lustre_network가 있으면, 그 서브넷의
    # 첫 주소(네트워크 주소 + 1)를 lustre_mgs_address로 사용해 동일하게 동작시킨다.
    - name: 예전 lustre_network 변수 호환 처리
      set_fact:
        lustre_mgs_address: "{{ (lustre_network.split('/')[0].split('.')[:-1] + ['1']) | join('.') }}"
      when:
        - lustre_network is defined
        - not lustre_mgs_address

    # lustre_mgs_address(MGS 서버 주소)로 커널이 실제로 라우팅할 인터페이스를
    # 대상 머신에서 직접 물어본다. 서브넷을 선언해 문자열로 비교하는 대신
    # 커널의 라우팅 테이블(정책 라우팅 포함)을 그대로 따르므로 더 견고하고,
    # 별도 콜렉션(ansible.utils) 없이 동작한다. lustre_mgs_address가 NID
    # 형식("주소@네트워크")이거나 failover MGS 쌍("주소1@네트워크:주소2@네트워크")
    # 이어도, 첫 "@" 이전 부분(첫 번째 MGS 주소)만 취해 동작한다.
    - name: lustre_mgs_address로 라우팅되는 인터페이스 조회
      command: "ip -4 route get {{ lustre_mgs_address.split('@')[0] }}"
      register: lustre_mgs_route
      changed_when: false
    - name: Private network interface 확인
      set_fact:
        private_interface: "{{ lustre_mgs_route.stdout | regex_search('dev (\\S+)', '\\1') }}"
    - name: lnet 네트워크를 modprobe.d에 기록
      copy:
        dest: /etc/modprobe.d/lustre.conf
        content: "options lnet networks=\"tcp({{ private_interface }})\"\n"
        mode: "0644"

- name: 커널 모듈 의존성 트리 재생성
  command: /usr/sbin/depmod -a
  changed_when: false
