name: Bake Lustre build VM images

# Prepares one VM image per non-DKMS compile target (base OS + epel-release +
# CRB + build deps + kernel-devel/kernel-headers matching the latest kernel,
# already rebooted into it) and publishes it as a GitHub Release asset. The
# main build workflow downloads this instead of re-installing the same
# packages on every single run.
on:
  workflow_dispatch:
    inputs:
      os_key:
        description: 'Only bake this OS (distribution+version, e.g. "Rocky9.7"). Leave empty to consider every target (existing ones are still skipped unless force=true).'
        type: string
        default: ''
      force:
        description: 'Rebake targets even if a vm-image-<os_key> release already exists'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  discover:
    name: Discover bake targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
      has_jobs: ${{ steps.generate.outputs.has_jobs }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install pyyaml

      - id: generate
        run: |
          if [ -n "${{ github.event.inputs.os_key }}" ]; then
            python3 .github/scripts/generate_matrix.py --dedupe-by-os --filter-os-key "${{ github.event.inputs.os_key }}"
          else
            python3 .github/scripts/generate_matrix.py --dedupe-by-os
          fi

  bake:
    name: "Bake ${{ matrix.os_key }}"
    needs: discover
    if: needs.discover.outputs.has_jobs == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for existing baked image
        if: ${{ !matrix.produces_dkms }}
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="vm-image-${{ matrix.os_key }}"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::force=true, rebaking ${{ matrix.os_key }} even though a release may already exist."
          elif gh release view "$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::vm-image-${{ matrix.os_key }} already exists, skipping bake. Re-run this workflow with force=true to rebuild it."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip DKMS-only target (no VM image needed)
        if: matrix.produces_dkms
        run: |
          echo "::notice::${{ matrix.os_key }} only ships a DKMS package, no compile VM needed, nothing to bake."

      - name: Enable KVM access
        if: ${{ !matrix.produces_dkms && steps.existing.outputs.exists != 'true' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install VM tooling
        if: ${{ !matrix.produces_dkms && steps.existing.outputs.exists != 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils openssh-client

      - name: Locate cloud image URL
        if: ${{ !matrix.produces_dkms && steps.existing.outputs.exists != 'true' }}
        id: image
        run: |
          set -euo pipefail
          case "${{ matrix.distribution }}" in
            AlmaLinux)
              major="${{ matrix.version }}"
              major="${major%%.*}"
              live_index="https://repo.almalinux.org/almalinux/${major}/cloud/x86_64/images/"
              file=$(curl -sL "$live_index" \
                | grep -oE "AlmaLinux-${major}-GenericCloud-${{ matrix.version }}-[0-9]+\.x86_64\.qcow2" \
                | sort -V | tail -n1 || true)
              if [ -n "$file" ]; then
                echo "url=${live_index}${file}" >> "$GITHUB_OUTPUT"
                echo "vault=false" >> "$GITHUB_OUTPUT"
              else
                # ${{ matrix.version }} has been superseded on the live mirror
                # (AlmaLinux only keeps the current minor there). Fall back to
                # the frozen vault, which keeps every past minor's repos and
                # cloud images indefinitely.
                vault_index="https://vault.almalinux.org/${{ matrix.version }}/cloud/x86_64/images/"
                file=$(curl -sL "$vault_index" \
                  | grep -oE "AlmaLinux-${major}-GenericCloud-${{ matrix.version }}-[0-9]+\.x86_64\.qcow2" \
                  | sort -V | tail -n1 || true)
                if [ -z "$file" ]; then
                  echo "::error::Could not find an AlmaLinux ${{ matrix.version }} GenericCloud image on repo.almalinux.org or vault.almalinux.org"
                  exit 1
                fi
                echo "url=${vault_index}${file}" >> "$GITHUB_OUTPUT"
                echo "vault=true" >> "$GITHUB_OUTPUT"
                echo "::notice::${{ matrix.version }} is no longer on the live AlmaLinux mirror; using the frozen vault.almalinux.org snapshot instead."
              fi
              ;;
            Rocky)
              major="${{ matrix.version }}"
              major="${major%%.*}"
              live_index="https://dl.rockylinux.org/pub/rocky/${major}/images/x86_64/"
              file=$(curl -sL "$live_index" \
                | grep -oE "Rocky-${major}-GenericCloud-Base-${{ matrix.version }}-[0-9]+\.[0-9]+\.x86_64\.qcow2" \
                | sort -V | tail -n1 || true)
              if [ -n "$file" ]; then
                echo "url=${live_index}${file}" >> "$GITHUB_OUTPUT"
                echo "vault=false" >> "$GITHUB_OUTPUT"
              else
                # Rocky also only keeps the current minor's images/repos on
                # the live mirror; older minors move to the vault.
                vault_index="https://dl.rockylinux.org/vault/rocky/${{ matrix.version }}/images/x86_64/"
                file=$(curl -sL "$vault_index" \
                  | grep -oE "Rocky-${major}-GenericCloud-Base-${{ matrix.version }}-[0-9]+\.[0-9]+\.x86_64\.qcow2" \
                  | sort -V | tail -n1 || true)
                if [ -z "$file" ]; then
                  echo "::error::Could not find a Rocky ${{ matrix.version }} GenericCloud image on the live mirror or the vault"
                  exit 1
                fi
                echo "url=${vault_index}${file}" >> "$GITHUB_OUTPUT"
                echo "vault=true" >> "$GITHUB_OUTPUT"
                echo "::notice::${{ matrix.version }} is no longer on the live Rocky mirror; using the frozen dl.rockylinux.org/vault snapshot instead."
              fi
              ;;
            *)
              echo "::error::No cloud image lookup implemented yet for distribution '${{ matrix.distribution }}'. Add one in this step."
              exit 1
              ;;
          esac

      - name: Download cloud image
        if: ${{ !matrix.produces_dkms && steps.existing.outputs.exists != 'true' }}
        run: |
          echo "Downloading ${{ steps.image.outputs.url }}"
          curl -sL -o base.qcow2 "${{ steps.image.outputs.url }}"
          qemu-img create -f qcow2 -F qcow2 -b "$(pwd)/base.qcow2" disk.qcow2 20G

      - name: Build cloud-init seed
        if: ${{ !matrix.produces_dkms && steps.existing.outputs.exists != 'true' }}
        run: |
          ssh-keygen -t ed25519 -N '' -f vm_key -q
          cat > user-data <<CLOUDINIT
          #cloud-config
          users:
            - name: builder
              sudo: ALL=(ALL) NOPASSWD:ALL
              shell: /bin/bash
              ssh_authorized_keys:
                - $(cat vm_key.pub)
          ssh_pwauth: false
          CLOUDINIT
          cat > meta-data <<CLOUDINIT
          instance-id: lustre-bake-${{ matrix.os_key }}
          local-hostname: lustre-bake
          CLOUDINIT
          cloud-localds seed.iso user-data meta-data

      - name: Boot VM
        if: ${{ !matrix.produces_dkms && steps.existing.outputs.exists != 'true' }}
        run: |
          qemu-system-x86_64 \
            -machine accel=kvm -cpu host -smp 2 -m 4096 \
            -drive file=disk.qcow2,if=virtio \
            -drive file=seed.iso,if=virtio,format=raw \
            -nic user,model=virtio,hostfwd=tcp::2222-:22 \
            -display none -daemonize \
            -serial file:console.log \
            -monitor none

      - name: Wait for SSH
        if: ${{ !matrix.produces_dkms && steps.existing.outputs.exists != 'true' }}
        run: |
          for i in $(seq 1 60); do
            if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i vm_key -p 2222 builder@127.0.0.1 true 2>/dev/null; then
              echo "SSH is up after ${i} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::VM never became reachable over SSH"
          cat console.log || true
          exit 1

      - name: Pin repos to vault snapshot
        if: ${{ !matrix.produces_dkms && steps.existing.outputs.exists != 'true' && steps.image.outputs.vault == 'true' }}
        env:
          VAULT_VERSION: ${{ matrix.version }}
          VAULT_DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i vm_key -p 2222 builder@127.0.0.1 \
            "VAULT_VERSION='${VAULT_VERSION}' VAULT_DISTRIBUTION='${VAULT_DISTRIBUTION}' bash -s" <<'REMOTE'
          set -euo pipefail
          case "$VAULT_DISTRIBUTION" in
            AlmaLinux)
              sudo sed -i \
                -e 's|^mirrorlist=|#mirrorlist=|' \
                -e 's|^metalink=|#metalink=|' \
                -e "s|^#[[:space:]]*baseurl=https://repo.almalinux.org/almalinux/\$releasever|baseurl=https://vault.almalinux.org/${VAULT_VERSION}|" \
                /etc/yum.repos.d/almalinux*.repo
              ;;
            Rocky)
              sudo sed -i \
                -e 's|^mirrorlist=|#mirrorlist=|' \
                -e "s|^#baseurl=http://dl.rockylinux.org/\$contentdir/\$releasever|baseurl=https://dl.rockylinux.org/vault/rocky/${VAULT_VERSION}|" \
                /etc/yum.repos.d/rocky*.repo
              ;;
          esac
          sudo dnf clean all
          REMOTE

      - name: Install build dependencies and reboot into the latest kernel
        if: ${{ !matrix.produces_dkms && steps.existing.outputs.exists != 'true' }}
        run: |
          ssh_run() { ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i vm_key -p 2222 builder@127.0.0.1 "$@"; }
          ssh_run 'sudo dnf -y update kernel kernel-core kernel-modules'
          ssh_run 'sudo systemctl reboot' || true
          sleep 10
          up=false
          for i in $(seq 1 60); do
            if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i vm_key -p 2222 builder@127.0.0.1 true 2>/dev/null; then
              up=true
              break
            fi
            sleep 5
          done
          if [ "$up" != "true" ]; then
            echo "::error::VM did not come back after reboot"
            exit 1
          fi
          ssh_run 'sudo dnf -y install dnf-plugins-core'
          ssh_run 'sudo dnf config-manager --set-enabled crb' || true
          ssh_run 'sudo dnf -y install epel-release'
          ssh_run 'sudo dnf -y install "@Development Tools" rpm-build rpmdevtools rpmrebuild \
            "kernel-devel-$(uname -r)" kernel-headers kernel-abi-stablelists kernel-rpm-macros \
            openssl-devel libmount-devel libnl3-devel libselinux-devel libselinux-static \
            zlib-devel libyaml-devel libtool dkms \
            keyutils-libs-devel json-c-devel python3-devel python3-pip \
            dwarves ncurses-c++-libs ncurses-devel \
            e2fsprogs-devel libcom_err-devel \
            git autoconf automake pkgconfig unzip'
          ssh_run 'rpmdev-setuptree'

      - name: Shut down VM
        if: ${{ !matrix.produces_dkms && steps.existing.outputs.exists != 'true' }}
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i vm_key -p 2222 builder@127.0.0.1 'sudo shutdown -h now' || true
          for i in $(seq 1 30); do
            if ! ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i vm_key -p 2222 -o ConnectTimeout=3 builder@127.0.0.1 true 2>/dev/null; then
              echo "VM is down"
              break
            fi
            sleep 2
          done
          sleep 5

      - name: Compress and publish baked image
        if: ${{ !matrix.produces_dkms && steps.existing.outputs.exists != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          qemu-img convert -O qcow2 -c disk.qcow2 "baked-${{ matrix.os_key }}.qcow2"
          ls -lh "baked-${{ matrix.os_key }}.qcow2"
          tag="vm-image-${{ matrix.os_key }}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --title "Lustre build VM image: ${{ matrix.os_key }}" \
            --notes "Pre-baked ${{ matrix.distribution }} ${{ matrix.version }} (${{ matrix.vendor }}) build VM: epel-release + CRB + Development Tools + matching kernel-devel/headers, already rebooted into its latest kernel. Rebuilt on demand via workflow_dispatch of bake-vm-image.yml."
          gh release upload "$tag" "baked-${{ matrix.os_key }}.qcow2" --clobber
