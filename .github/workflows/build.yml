name: Build Lustre client RPMs

on:
  # Triggered by pushing a tag named <Distribution>_<Version>_<Vendor>_<anything>,
  # e.g. "AlmaLinux_9.8_ddn_v20260727" - only that one OS/version/vendor target
  # is built (see the "Parse target from tag" step below), not the whole
  # matrix. The trailing "_<anything>" segment can be a date, a counter,
  # whatever's needed to make the tag unique for re-runs; it isn't parsed.
  push:
    tags:
      - 'AlmaLinux_*'
      - 'Alma_*'
      - 'Rocky_*'
      - 'CentOS_*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  discover:
    name: Discover build targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
      has_jobs: ${{ steps.generate.outputs.has_jobs }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install pyyaml

      - name: Parse target from tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
            IFS='_' read -r distribution version vendor _rest <<< "$tag"
            if [ -z "$distribution" ] || [ -z "$version" ] || [ -z "$vendor" ]; then
              echo "::error::Tag '$tag' doesn't match <Distribution>_<Version>_<Vendor>_<...> format"
              exit 1
            fi
            # Accept short aliases for distribution names in the tag.
            case "$distribution" in
              Alma) distribution="AlmaLinux" ;;
            esac
            echo "::notice::Tag '$tag' -> building only ${distribution} ${version} (${vendor})"
            echo "filter=${distribution}${version}_${vendor}" >> "$GITHUB_OUTPUT"
          else
            echo "filter=" >> "$GITHUB_OUTPUT"
          fi

      - id: generate
        run: |
          if [ -n "${{ steps.tag.outputs.filter }}" ]; then
            python3 .github/scripts/generate_matrix.py --filter-label-prefix "${{ steps.tag.outputs.filter }}"
          else
            python3 .github/scripts/generate_matrix.py
          fi

  compile:
    # Kernel modules can't be meaningfully built/loaded inside a Docker
    # container (it shares the runner's kernel). Instead this job boots a
    # real VM with the target distro's own GenericCloud image over
    # QEMU/KVM (GitHub-hosted ubuntu-latest runners expose /dev/kvm), so
    # the compiled kmod-lustre-client is built and modprobe'd against a
    # genuine matching kernel. If a pre-baked image was published by
    # bake-vm-image.yml (already has build deps + matching kernel-devel
    # installed), that's used directly instead of installing everything
    # from scratch on every run.
    name: "Compile ${{ matrix.label }}"
    needs: discover
    if: needs.discover.outputs.has_jobs == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip DKMS-only target (no compile needed)
        if: matrix.produces_dkms
        run: |
          echo "::notice::${{ matrix.label }} only ships a DKMS package (from ${{ matrix.source }})."
          echo "::notice::DKMS rebuilds the kernel module on the target host at install time, so no CI compile is attempted."

      - name: Enable KVM access
        if: ${{ !matrix.produces_dkms }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install VM tooling
        if: ${{ !matrix.produces_dkms }}
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils openssh-client

      - name: Check for pre-baked VM image
        if: ${{ !matrix.produces_dkms }}
        id: baked
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="vm-image-${{ matrix.label }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "::notice::Using pre-baked VM image from release '$tag'."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No pre-baked VM image for '$tag'. Installing build deps from scratch (run the 'Bake Lustre build VM images' workflow to speed this up)."
          fi

      - name: Download pre-baked VM image
        if: ${{ !matrix.produces_dkms && steps.baked.outputs.available == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ steps.baked.outputs.tag }}" --pattern '*.qcow2' --clobber
          mv "baked-${{ matrix.label }}.qcow2" disk.qcow2
          ls -lh disk.qcow2

      - name: Locate cloud image URL
        if: ${{ !matrix.produces_dkms && steps.baked.outputs.available != 'true' }}
        id: image
        run: |
          set -euo pipefail
          case "${{ matrix.distribution }}" in
            AlmaLinux)
              major="${{ matrix.version }}"
              major="${major%%.*}"
              live_index="https://repo.almalinux.org/almalinux/${major}/cloud/x86_64/images/"
              file=$(curl -sL "$live_index" \
                | grep -oE "AlmaLinux-${major}-GenericCloud-${{ matrix.version }}-[0-9]+\.x86_64\.qcow2" \
                | sort -V | tail -n1 || true)
              if [ -n "$file" ]; then
                echo "url=${live_index}${file}" >> "$GITHUB_OUTPUT"
                echo "vault=false" >> "$GITHUB_OUTPUT"
              else
                # ${{ matrix.version }} has been superseded on the live mirror
                # (AlmaLinux only keeps the current minor there). Fall back to
                # the frozen vault, which keeps every past minor's repos and
                # cloud images indefinitely.
                vault_index="https://vault.almalinux.org/${{ matrix.version }}/cloud/x86_64/images/"
                file=$(curl -sL "$vault_index" \
                  | grep -oE "AlmaLinux-${major}-GenericCloud-${{ matrix.version }}-[0-9]+\.x86_64\.qcow2" \
                  | sort -V | tail -n1 || true)
                if [ -z "$file" ]; then
                  echo "::error::Could not find an AlmaLinux ${{ matrix.version }} GenericCloud image on repo.almalinux.org or vault.almalinux.org"
                  exit 1
                fi
                echo "url=${vault_index}${file}" >> "$GITHUB_OUTPUT"
                echo "vault=true" >> "$GITHUB_OUTPUT"
                echo "::notice::${{ matrix.version }} is no longer on the live AlmaLinux mirror; using the frozen vault.almalinux.org snapshot instead."
              fi
              ;;
            Rocky)
              major="${{ matrix.version }}"
              major="${major%%.*}"
              live_index="https://dl.rockylinux.org/pub/rocky/${major}/images/x86_64/"
              file=$(curl -sL "$live_index" \
                | grep -oE "Rocky-${major}-GenericCloud-Base-${{ matrix.version }}-[0-9]+\.[0-9]+\.x86_64\.qcow2" \
                | sort -V | tail -n1 || true)
              if [ -n "$file" ]; then
                echo "url=${live_index}${file}" >> "$GITHUB_OUTPUT"
                echo "vault=false" >> "$GITHUB_OUTPUT"
              else
                # Rocky also only keeps the current minor's images/repos on
                # the live mirror; older minors move to the vault.
                vault_index="https://dl.rockylinux.org/vault/rocky/${{ matrix.version }}/images/x86_64/"
                file=$(curl -sL "$vault_index" \
                  | grep -oE "Rocky-${major}-GenericCloud-Base-${{ matrix.version }}-[0-9]+\.[0-9]+\.x86_64\.qcow2" \
                  | sort -V | tail -n1 || true)
                if [ -z "$file" ]; then
                  echo "::error::Could not find a Rocky ${{ matrix.version }} GenericCloud image on the live mirror or the vault"
                  exit 1
                fi
                echo "url=${vault_index}${file}" >> "$GITHUB_OUTPUT"
                echo "vault=true" >> "$GITHUB_OUTPUT"
                echo "::notice::${{ matrix.version }} is no longer on the live Rocky mirror; using the frozen dl.rockylinux.org/vault snapshot instead."
              fi
              ;;
            *)
              echo "::error::No cloud image lookup implemented yet for distribution '${{ matrix.distribution }}'. Add one in this step."
              exit 1
              ;;
          esac

      - name: Cache cloud image
        if: ${{ !matrix.produces_dkms && steps.baked.outputs.available != 'true' }}
        uses: actions/cache@v4
        with:
          path: base.qcow2
          # The AlmaLinux filename embeds its build date, so a new dated
          # image (i.e. a real update) naturally busts this cache.
          key: cloud-image-${{ steps.image.outputs.url }}

      - name: Download base cloud image
        if: ${{ !matrix.produces_dkms && steps.baked.outputs.available != 'true' }}
        run: |
          if [ -f base.qcow2 ]; then
            echo "Using cached base.qcow2"
          else
            echo "Downloading ${{ steps.image.outputs.url }}"
            curl -sL -o base.qcow2 "${{ steps.image.outputs.url }}"
          fi
          qemu-img create -f qcow2 -F qcow2 -b "$(pwd)/base.qcow2" disk.qcow2 20G

      - name: Build cloud-init seed
        if: ${{ !matrix.produces_dkms }}
        run: |
          ssh-keygen -t ed25519 -N '' -f vm_key -q
          cat > user-data <<CLOUDINIT
          #cloud-config
          users:
            - name: builder
              sudo: ALL=(ALL) NOPASSWD:ALL
              shell: /bin/bash
              ssh_authorized_keys:
                - $(cat vm_key.pub)
          ssh_pwauth: false
          CLOUDINIT
          cat > meta-data <<CLOUDINIT
          instance-id: lustre-build-${{ matrix.label }}
          local-hostname: lustre-build
          CLOUDINIT
          cloud-localds seed.iso user-data meta-data

      - name: Boot VM
        if: ${{ !matrix.produces_dkms }}
        run: |
          qemu-system-x86_64 \
            -machine accel=kvm -cpu host -smp 2 -m 4096 \
            -drive file=disk.qcow2,if=virtio \
            -drive file=seed.iso,if=virtio,format=raw \
            -nic user,model=virtio,hostfwd=tcp::2222-:22 \
            -display none -daemonize \
            -serial file:console.log \
            -monitor none

      - name: Wait for SSH
        if: ${{ !matrix.produces_dkms }}
        run: |
          for i in $(seq 1 60); do
            if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i vm_key -p 2222 builder@127.0.0.1 true 2>/dev/null; then
              echo "SSH is up after ${i} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::VM never became reachable over SSH"
          cat console.log || true
          exit 1

      - name: Pin repos to vault snapshot
        if: ${{ !matrix.produces_dkms && steps.baked.outputs.available != 'true' && steps.image.outputs.vault == 'true' }}
        env:
          VAULT_VERSION: ${{ matrix.version }}
          VAULT_DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i vm_key -p 2222 builder@127.0.0.1 \
            "VAULT_VERSION='${VAULT_VERSION}' VAULT_DISTRIBUTION='${VAULT_DISTRIBUTION}' bash -s" <<'REMOTE'
          set -euo pipefail
          case "$VAULT_DISTRIBUTION" in
            AlmaLinux)
              sudo sed -i \
                -e 's|^mirrorlist=|#mirrorlist=|' \
                -e 's|^metalink=|#metalink=|' \
                -e "s|^#baseurl=https://repo.almalinux.org/almalinux/\$releasever|baseurl=https://vault.almalinux.org/${VAULT_VERSION}|" \
                /etc/yum.repos.d/almalinux*.repo
              ;;
            Rocky)
              sudo sed -i \
                -e 's|^mirrorlist=|#mirrorlist=|' \
                -e "s|^#baseurl=http://dl.rockylinux.org/\$contentdir/\$releasever|baseurl=https://dl.rockylinux.org/vault/rocky/${VAULT_VERSION}|" \
                /etc/yum.repos.d/rocky*.repo
              ;;
          esac
          sudo dnf clean all
          REMOTE

      - name: Reboot into the latest kernel
        if: ${{ !matrix.produces_dkms && steps.baked.outputs.available != 'true' }}
        run: |
          ssh_run() { ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i vm_key -p 2222 builder@127.0.0.1 "$@"; }
          ssh_run 'sudo dnf -y update kernel kernel-core kernel-modules'
          ssh_run 'sudo systemctl reboot' || true
          sleep 10
          for i in $(seq 1 60); do
            if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i vm_key -p 2222 builder@127.0.0.1 true 2>/dev/null; then
              echo "VM back up after reboot"
              exit 0
            fi
            sleep 5
          done
          echo "::error::VM did not come back after reboot"
          exit 1

      - name: Copy source into VM
        if: ${{ !matrix.produces_dkms && (matrix.source_type == 'tarball' || matrix.source_type == 'srpm_zip') }}
        run: |
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i vm_key -P 2222 \
            "srpm/${{ matrix.source }}" builder@127.0.0.1:/home/builder/

      - name: Install build dependencies in VM
        if: ${{ !matrix.produces_dkms && steps.baked.outputs.available != 'true' }}
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i vm_key -p 2222 builder@127.0.0.1 bash -s <<'REMOTE'
          set -euo pipefail
          sudo dnf -y install dnf-plugins-core
          sudo dnf config-manager --set-enabled crb || true
          sudo dnf -y install epel-release
          sudo dnf -y install '@Development Tools' rpm-build rpmdevtools rpmrebuild \
            "kernel-devel-$(uname -r)" kernel-headers kernel-abi-stablelists kernel-rpm-macros \
            openssl-devel libmount-devel libnl3-devel libselinux-devel libselinux-static \
            zlib-devel libyaml-devel libtool dkms \
            keyutils-libs-devel json-c-devel python3-devel python3-pip \
            dwarves ncurses-c++-libs ncurses-devel \
            e2fsprogs-devel libcom_err-devel \
            git autoconf automake pkgconfig unzip
          rpmdev-setuptree
          REMOTE

      # Vendor .src.rpm shipped inside a zip (e.g. Cray/HPE releases): unpack
      # the zip and install the srpm, which populates ~/rpmbuild/SPECS +
      # SOURCES the same way it would on a real build host.
      - name: Unpack srpm from zip in VM
        if: ${{ !matrix.produces_dkms && matrix.source_type == 'srpm_zip' }}
        env:
          SOURCE_NAME: ${{ matrix.source }}
          SRPM_PATH_IN_ZIP: ${{ matrix.srpm_path_in_zip }}
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i vm_key -p 2222 builder@127.0.0.1 \
            "SOURCE_NAME='${SOURCE_NAME}' SRPM_PATH_IN_ZIP='${SRPM_PATH_IN_ZIP}' bash -s" <<'REMOTE'
          set -euo pipefail
          rpmdev-setuptree
          mkdir -p "$HOME/srpm-zip"
          unzip -o "$HOME/${SOURCE_NAME}" -d "$HOME/srpm-zip"
          rpm -ivh --nosignature "$HOME/srpm-zip/${SRPM_PATH_IN_ZIP}"
          REMOTE

      # Whamcloud vendor: instead of a tarball committed under srpm/, clone
      # the official community source straight from github.com/lustre/lustre-release
      # at the guide's github_ref and package it the same way a vendor would
      # (autogen.sh + configure + make dist), so the result can feed into the
      # same generic "Run rpmbuild in VM" step below.
      - name: Fetch and package Whamcloud source in VM
        if: ${{ !matrix.produces_dkms && matrix.source_type == 'github' }}
        env:
          LUSTRE_REF: ${{ matrix.github_ref }}
          SOURCE_NAME: ${{ matrix.source }}
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i vm_key -p 2222 builder@127.0.0.1 \
            "LUSTRE_REF='${LUSTRE_REF}' SOURCE_NAME='${SOURCE_NAME}' bash -s" <<'REMOTE'
          set -euo pipefail
          if [ "$LUSTRE_REF" = "latest" ]; then
            # Lustre release tags look like v2_17_56 (underscores, not dots).
            # Pick the highest plain "vX_Y_Z" tag, skipping -RC/-beta pre-releases.
            LUSTRE_REF=$(git ls-remote --tags https://github.com/lustre/lustre-release.git \
              | grep -oE 'refs/tags/v[0-9]+_[0-9]+_[0-9]+$' \
              | sed 's|refs/tags/||' \
              | sed 's/_/./g' \
              | sort -V \
              | tail -n1 \
              | sed 's/\./_/g' || true)
            if [ -z "$LUSTRE_REF" ]; then
              echo "::error::Could not resolve 'latest' lustre-release tag"
              exit 1
            fi
            echo "::notice::Resolved whamcloud github_ref 'latest' -> $LUSTRE_REF"
          fi
          git clone --branch "$LUSTRE_REF" --depth 1 https://github.com/lustre/lustre-release.git lustre-src
          cd lustre-src
          sh autogen.sh
          ./configure --disable-server
          make dist
          dist_tarball=$(find . -maxdepth 1 -name 'lustre-*.tar.gz' | head -n1)
          if [ -z "$dist_tarball" ]; then
            echo "::error::'make dist' did not produce a tarball"
            exit 1
          fi
          cp "$dist_tarball" "$HOME/${SOURCE_NAME}"
          REMOTE

      - name: Run rpmbuild in VM
        if: ${{ !matrix.produces_dkms }}
        env:
          RPMBUILD_OPTIONS: ${{ matrix.rpmbuild_options }}
          SOURCE_NAME: ${{ matrix.source }}
          SOURCE_TYPE: ${{ matrix.source_type }}
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i vm_key -p 2222 builder@127.0.0.1 \
            "RPMBUILD_OPTIONS='${RPMBUILD_OPTIONS}' SOURCE_NAME='${SOURCE_NAME}' SOURCE_TYPE='${SOURCE_TYPE}' bash -s" <<'REMOTE'
          set -euo pipefail
          rpmdev-setuptree
          if [ "$SOURCE_TYPE" = "srpm_zip" ]; then
            spec=$(find "$HOME/rpmbuild/SPECS" -maxdepth 1 -name '*.spec' | head -n1)
            if [ -z "$spec" ]; then
              echo "::error::No .spec file found under rpmbuild/SPECS after installing the srpm"
              exit 1
            fi
            rpmbuild -bb --define "kver $(uname -r)" ${RPMBUILD_OPTIONS} "$spec"
          else
            rpmbuild -tb --define "kver $(uname -r)" ${RPMBUILD_OPTIONS} "$HOME/${SOURCE_NAME}"
          fi
          REMOTE

      - name: Install and modprobe the built kmod in VM
        if: ${{ !matrix.produces_dkms }}
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i vm_key -p 2222 builder@127.0.0.1 bash -s <<'REMOTE'
          set -euo pipefail
          kmod_rpm=$(find "$HOME/rpmbuild/RPMS" -type f \
            \( -iname 'kmod-lustre-client-[0-9]*.rpm' -o -iname 'lustre-client-[0-9]*.rpm' \) \
            ! -iname '*debuginfo*' ! -iname '*debugsource*' | sort | head -n1)
          if [ -z "$kmod_rpm" ]; then
            echo "::error::No kmod/client rpm found under rpmbuild/RPMS"
            find "$HOME/rpmbuild/RPMS" -type f
            exit 1
          fi
          sudo dnf -y install "$kmod_rpm"
          sudo depmod -a
          sudo modprobe lustre
          lsmod | grep -E 'lustre|lnet|libcfs'
          REMOTE

      - name: Copy built RPMs out of VM
        if: ${{ !matrix.produces_dkms }}
        run: |
          mkdir -p RPMS
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i vm_key -P 2222 -r \
            builder@127.0.0.1:rpmbuild/RPMS/. RPMS/

      - name: Upload built RPMs
        if: ${{ !matrix.produces_dkms }}
        uses: actions/upload-artifact@v4
        with:
          name: lustre-${{ matrix.label }}
          path: RPMS/**/*.rpm
          if-no-files-found: error

      - name: Publish built RPMs to GitHub Release
        if: ${{ !matrix.produces_dkms }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_NAME: ${{ matrix.source }}
        run: |
          set -euo pipefail
          mapfile -t rpm_files < <(find RPMS -type f -name '*.rpm')
          if [ "${#rpm_files[@]}" -eq 0 ]; then
            echo "::error::No rpm files found under RPMS/ to publish"
            exit 1
          fi
          source_base="${SOURCE_NAME%.tar.gz}"
          tag="lustre-${{ matrix.label }}-${source_base}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --title "Lustre client RPMs: ${{ matrix.label }} (${SOURCE_NAME})" \
            --notes "Compiled from srpm/${SOURCE_NAME} for ${{ matrix.distribution }} ${{ matrix.version }} (${{ matrix.vendor }}). Built and modprobe-verified against a real kernel by .github/workflows/build.yml."
          gh release upload "$tag" "${rpm_files[@]}" --clobber

      - name: Shut down VM
        if: always() && !matrix.produces_dkms
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i vm_key -p 2222 builder@127.0.0.1 'sudo shutdown -h now' || true
